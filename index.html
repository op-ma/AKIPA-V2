  const s = A.set, r = selP().filter(([p]) => t === 'ikut' || p.juara); if (!r.length) return toast(t === 'juara' ? 'Belum ada peserta yang diberi juara.' : 'Belum ada peserta.');
  if (!s.cert_bg) toast('Desain sertifikat belum diunggah, dicetak tanpa latar.');
  const tpl = t === 'ikut' ? (s.cert_ikut || '{nama}') : (s.cert_juara || '{nama} Juara {juara}');
  doPrint(r.map(([p, l]) => { const tx = tpl.replace(/{nama}/g, p.nama).replace(/{markaz}/g, p.markaz).replace(/{kelas}/g, p.kelas).replace(/{nisn}/g, p.nisn).replace(/{ttl}/g, [p.tempat_lahir, p.tanggal_lahir].filter(Boolean).join(', ')).replace(/{kota}/g, p.kota).replace(/{lomba}/g, lbl(l)).replace(/{juara}/g, p.juara); return `<div class="cert" style="background-image:url('${esc(s.cert_bg || '')}')"><div style="position:absolute;left:10%;width:80%;top:${+s.cert_top || 38}%;text-align:center;font-size:${+s.cert_size || 24}px;color:${esc(s.cert_color || '#111')};white-space:pre-line;line-height:1.5">${esc(tx)}</div></div>`; }).join(''), true);
}
boot();
</script>
